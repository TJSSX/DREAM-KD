dataset:
  name: amazon_marc
  num_labels: 5

  candidates:
    - hf_name: amazon_reviews_multi
      hf_config: en
      text_column: review_body
      label_column: stars
      label_offset: 1

    - hf_name: SetFit/amazon_reviews_multi_en
      hf_config: null
      text_column: text
      label_column: label
      label_offset: 0

split:
  train_name: train
  test_name: test
  dev_name: validation

  # Used only when no validation split exists.
  dev_size: 0.1
  seed: 42

output:
  dir: data_processed/amazon_marc

processing:
  min_text_length: 5

sampling:
  # Options:
  #   full      = use all available examples
  #   random    = random sample while keeping natural class imbalance
  #   balanced  = stratified balanced sample by label
  strategy: balanced
  seed: 42

  # Used when strategy = balanced.
  # If a class has fewer examples than requested, all available examples are used.
  train_per_class: 1000
  dev_per_class: 200
  test_per_class: 200

  # Used when strategy = random.
  train_size: 5000
  dev_size: 1000
  test_size: 1000